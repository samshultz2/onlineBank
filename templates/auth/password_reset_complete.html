{% extends "base.html" %}
{% block title %}Password changed — SecureTrust Bank{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand">Secure<span class="brand-mark">Trust</span> Bank</span>
    </div>
    <h2>Password changed</h2>
    <p>Your password has been reset successfully. You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-accent btn-block">Sign in</a>
  </div>
</div>
{% endblock %}
