{% extends "base.html" %}
{% block title %}Check your email — SecureTrust Bank{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand">Secure<span class="brand-mark">Trust</span> Bank</span>
    </div>
    <h2>Check your inbox</h2>
    <p>If an account exists for the email you entered, we've sent a link to reset your password.</p>
    <div class="auth-footer"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
  </div>
</div>
{% endblock %}
