{% extends "base.html" %}
{% block title %}Reset password — SecureTrust Bank{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand">Secure<span class="brand-mark">Trust</span> Bank</span>
      <h2 class="mt-2">Reset your password</h2>
      <p class="text-muted small">Enter your email and we'll send you a reset link.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form.html" %}
      <button type="submit" class="btn btn-accent btn-block">Send reset link</button>
    </form>
    <div class="auth-footer"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
  </div>
</div>
{% endblock %}
