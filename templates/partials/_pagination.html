{% if page.has_other_pages %}
<div class="pagination">
  {% if page.has_previous %}
    <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page.previous_page_number }}">‹ Prev</a>
  {% endif %}
  <span class="current">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page.next_page_number }}">Next ›</a>
  {% endif %}
</div>
{% endif %}
